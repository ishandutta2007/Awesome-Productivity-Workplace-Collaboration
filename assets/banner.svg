<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
      }
      .orbit-glow-1 {
        animation: floatA 8s ease-in-out infinite alternate;
      }
      .orbit-glow-2 {
        animation: floatB 10s ease-in-out infinite alternate;
      }
      .moving-pulse {
        animation: pulseLine 6s ease-in-out infinite;
      }
      .flow-pulse {
        stroke-dasharray: 8 12;
        animation: dashMove 15s linear infinite;
      }
      @keyframes floatA {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(30px, 20px) scale(1.15); }
      }
      @keyframes floatB {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-25px, -15px) scale(1.1); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -200; }
      }
      @keyframes pulseLine {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Deep Workspace Gradient Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Animated Atmosphere (Kept deep in background) -->
  <g opacity="0.35">
    <circle class="orbit-glow-1" cx="200" cy="80" r="140" fill="#4338ca" filter="blur(50px)" />
    <circle class="orbit-glow-2" cx="1020" cy="240" r="160" fill="#0284c7" filter="blur(60px)" />
    <circle cx="600" cy="310" r="120" fill="#7e22ce" filter="blur(65px)" />
  </g>

  <!-- Dynamic Animated Collaboration Flowlines in Lower Canvas -->
  <g class="moving-pulse" fill="none" stroke-width="1.5">
    <path class="flow-pulse" stroke="#38bdf8" opacity="0.4" d="M -50 270 Q 300 210, 600 275 T 1250 250" />
    <path class="flow-pulse" stroke="#a855f7" opacity="0.3" d="M -50 290 Q 350 330, 700 260 T 1250 290" />
  </g>

  <!-- Subtle Ambient Grid Dots -->
  <g fill="#334155" opacity="0.25">
    <circle cx="100" cy="60" r="2" /><circle cx="150" cy="60" r="2" /><circle cx="200" cy="60" r="2" />
    <circle cx="100" cy="110" r="2" /><circle cx="150" cy="110" r="2" /><circle cx="200" cy="110" r="2" />
    <circle cx="1000" cy="70" r="2" /><circle cx="1050" cy="70" r="2" /><circle cx="1100" cy="70" r="2" />
    <circle cx="1000" cy="120" r="2" /><circle cx="1050" cy="120" r="2" /><circle cx="1100" cy="120" r="2" />
  </g>

  <!-- Accent Division Rule -->
  <line x1="350" y1="210" x2="850" y2="210" stroke="url(#glowLine)" stroke-width="2" />

  <!-- High-Contrast Foreground Content (Protected from overlap) -->
  <!-- Top Category Chip -->
  <g transform="translate(600, 52)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <text text-anchor="middle" y="5" class="badge-text" fill="#38bdf8">⚡ CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="125" text-anchor="middle" class="title-text" fill="url(#titleGrad)" filter="url(#cardShadow)">
    Productivity &amp; Workplace Collaboration
  </text>

  <!-- Subtitle -->
  <text x="600" y="175" text-anchor="middle" class="subtitle-text">
    The Ultimate Guide to Connected Workspaces, Team Chat, Knowledge Hubs &amp; AI Work OS
  </text>

  <!-- Interactive Ecosystem Feature Pills -->
  <g transform="translate(600, 258)">
    <!-- Pill 1: Real-Time Team Chat -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" class="badge-text" fill="#e2e8f0">💬 Team Messaging</text>
    </g>
    <!-- Pill 2: Connected Docs & Wikis -->
    <g transform="translate(-180, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" class="badge-text" fill="#e2e8f0">📚 Docs &amp; Knowledge</text>
    </g>
    <!-- Pill 3: Visual Whiteboards -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" class="badge-text" fill="#e2e8f0">🎨 Infinite Canvases</text>
    </g>
    <!-- Pill 4: Relational Databases -->
    <g transform="translate(180, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" class="badge-text" fill="#e2e8f0">🗄️ No-Code Tables</text>
    </g>
    <!-- Pill 5: AI Orchestration -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" class="badge-text" fill="#38bdf8">🤖 AI Workspaces</text>
    </g>
  </g>
</svg>
